<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bridge</title>
    <style>
      :root { --bg: #fff; --fg: #111; --muted: #6b6b6b; --line: #111; --success: #087f23; --error: #b00020; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 12px/1.45 "Microsoft YaHei UI", "PingFang SC", Arial, sans-serif; }
      main { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
      .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
      .brand { font-weight: 700; letter-spacing: .04em; }
      .connection { color: var(--muted); font-size: 11px; }
      .connection.linked { color: var(--success); }
      .connection.offline { color: var(--error); }
      .btn { width: 100%; min-height: 40px; padding: 8px 12px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); font: inherit; font-weight: 600; cursor: pointer; }
      .btn:hover:not(:disabled) { background: var(--fg); color: var(--bg); }
      .btn:disabled { color: #999; border-color: #aaa; cursor: default; }
      .section { display: flex; flex-direction: column; gap: 8px; }
      .section-title { font-weight: 700; letter-spacing: .04em; }
      .selection-card { border: 1px solid var(--line); padding: 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
      .selection-count { font-size: 24px; line-height: 1; font-weight: 700; letter-spacing: -.04em; }
      .selection-label { color: var(--muted); font-size: 11px; text-align: right; }
      .selection-names { color: var(--muted); font-size: 11px; min-height: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .status { min-height: 18px; color: var(--muted); font-size: 11px; }
      .status.error { color: var(--error); }
      .status.success { color: var(--success); }
    </style>
  </head>
  <body>
    <main>
      <div class="header">
        <div class="brand">BRIDGE</div>
        <div id="conn" class="connection">正在连接本地服务…</div>
      </div>

      <button class="btn" id="open-preview" type="button">打开实时预览</button>

      <section class="section" aria-labelledby="export-title">
        <div class="section-title" id="export-title">批量导出</div>
        <div class="selection-card">
          <div id="selection-count" class="selection-count">0</div>
          <div id="selection-label" class="selection-label">未选择画布对象</div>
        </div>
        <div id="selection-names" class="selection-names">请在 Figma 画布中选择一个或多个 Frame / 图层。</div>
        <button class="btn" id="batch-export-btn" type="button" disabled>选择文件夹并导出</button>
        <div id="export-status" class="status"></div>
      </section>
    </main>

    <script>
      const server = 'http://localhost:7789';
      const connEl = document.getElementById('conn');
      const countEl = document.getElementById('selection-count');
      const labelEl = document.getElementById('selection-label');
      const namesEl = document.getElementById('selection-names');
      const batchExportBtn = document.getElementById('batch-export-btn');
      const exportStatusEl = document.getElementById('export-status');
      let selectedItems = [];
      let batchInProgress = false;
      let pendingExportResolve = null;
      let pendingPreviewResolve = null;

      document.getElementById('open-preview').addEventListener('click', () => window.open(server + '/index.html'));

      async function ping() {
        try {
          const res = await fetch(server + '/health', { cache: 'no-store' });
          if (!res.ok) throw new Error('服务不可用');
          connEl.textContent = '本地服务已连接';
          connEl.className = 'connection linked';
        } catch (error) {
          connEl.textContent = '本地服务未连接';
          connEl.className = 'connection offline';
        }
      }

      function updateSelection(items) {
        selectedItems = Array.isArray(items) ? items : [];
        const count = selectedItems.length;
        countEl.textContent = String(count);
        labelEl.textContent = count ? `已选择 ${count} 个画布对象` : '未选择画布对象';
        namesEl.textContent = count
          ? selectedItems.map((item) => item.name || item.id).join('、')
          : '请在 Figma 画布中选择一个或多个 Frame / 图层。';
        batchExportBtn.disabled = batchInProgress || count === 0;
      }

      function chunk(arr, size) {
        const result = [];
        for (let index = 0; index < arr.length; index += size) result.push(arr.slice(index, index + size));
        return result;
      }

      function requestExportMissing(ids) {
        return new Promise((resolve) => {
          pendingExportResolve = resolve;
          parent.postMessage({ pluginMessage: { type: 'export-missing-images', ids } }, '*');
        });
      }

      function requestFigmaRender() {
        return new Promise((resolve) => {
          pendingPreviewResolve = resolve;
          parent.postMessage({ pluginMessage: { type: 'export-figma-render' } }, '*');
        });
      }

      async function uploadAssets(composition, imageIds) {
        if (imageIds.length) {
          let missing = imageIds;
          try {
            const response = await fetch(server + '/api/images/check', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids: imageIds }) });
            if (response.ok) {
              const data = await response.json();
              missing = Array.isArray(data.missing) ? data.missing : [];
            }
          } catch (error) { console.warn('[Bridge] 图片检查失败', error); }

          if (missing.length) {
            const result = await requestExportMissing(missing);
            const items = Array.isArray(result.items) ? result.items : [];
            for (const batch of chunk(items, 50)) {
              if (!batch.length) continue;
              const response = await fetch(server + '/api/images/batch', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items: batch }) });
              if (!response.ok) throw new Error(`图片上传失败（${response.status}）`);
            }
          }
        }

        const svgItems = [];
        (function collectSvg(node) {
          if (!node || node.visible === false) return;
          if (typeof node._svgContent === 'string' && typeof node.svgId === 'string' && node._svgContent) svgItems.push({ id: node.svgId, data: node._svgContent });
          if (Array.isArray(node.children)) node.children.forEach(collectSvg);
        })({ children: composition.children });

        const svgIds = Array.from(new Set(svgItems.map((item) => item.id)));
        if (svgIds.length) {
          const check = await fetch(server + '/api/svgs/check', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids: svgIds }) });
          let missingIds = svgIds;
          if (check.ok) {
            const data = await check.json();
            missingIds = Array.isArray(data.missing) ? data.missing : [];
          }
          const missing = svgItems.filter((item) => missingIds.includes(item.id));
          if (missing.length) {
            const response = await fetch(server + '/api/svgs/batch', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items: missing }) });
            if (!response.ok) throw new Error(`SVG 上传失败（${response.status}）`);
          }
        }

        (function cleanupSvg(node) {
          if (!node || typeof node !== 'object') return;
          delete node._svgContent;
          delete node.svgContent;
          if (Array.isArray(node.children)) node.children.forEach(cleanupSvg);
        })({ children: composition.children });
      }

      async function processComposition(composition, imageIds, options) {
        if (!composition || !Array.isArray(composition.children) || !composition.children.length) return false;
        await uploadAssets(composition, imageIds);
        let figmaRender = null;
        if (options.includeFigmaRender) {
          try {
            const preview = await requestFigmaRender();
            const base64 = preview && typeof preview.base64 === 'string' ? preview.base64 : '';
            if (base64 && base64.length <= 8000000) figmaRender = { base64 };
          } catch (error) { /* 对比截图不影响导出 */ }
        }

        const body = { composition, figmaRender };
        if (options.exportBaseDir && options.exportFolderName) {
          body.exportBaseDir = options.exportBaseDir;
          body.exportFolderName = options.exportFolderName;
        }
        const response = await fetch(server + '/api/composition', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        if (!response.ok) throw new Error(`HTML 导出失败（${response.status}）`);
        return true;
      }

      function setStatus(text, type) {
        exportStatusEl.textContent = text || '';
        exportStatusEl.className = `status${type ? ` ${type}` : ''}`;
      }

      async function startBatchExport() {
        if (batchInProgress || !selectedItems.length) return;
        batchInProgress = true;
        updateSelection(selectedItems);
        setStatus('正在打开文件夹选择器…');
        try {
          const response = await fetch(server + '/api/select-directory', { method: 'POST' });
          if (!response.ok) throw new Error('无法打开文件夹选择器，请确认已重新启动本地服务。');
          const selected = await response.json();
          if (!selected || selected.cancelled || !selected.path) {
            setStatus('已取消导出');
            batchInProgress = false;
            updateSelection(selectedItems);
            return;
          }
          setStatus('正在准备导出…');
          parent.postMessage({ pluginMessage: { type: 'batch-export-selection', nodeIds: selectedItems.map((item) => item.id), targetDir: selected.path } }, '*');
        } catch (error) {
          setStatus(error && error.message ? error.message : String(error), 'error');
          batchInProgress = false;
          updateSelection(selectedItems);
        }
      }

      batchExportBtn.addEventListener('click', startBatchExport);

      window.onmessage = async (event) => {
        const msg = event.data && event.data.pluginMessage;
        if (!msg) return;
        if (msg.type === 'send-export-selection') { updateSelection(msg.items); return; }
        if (msg.type === 'send-composition') {
          if (batchInProgress) return;
          try { await processComposition(msg.composition || null, Array.isArray(msg.imageIds) ? msg.imageIds : [], { includeFigmaRender: true }); }
          catch (error) { console.warn('[Bridge] 实时预览更新失败', error); }
          return;
        }
        if (msg.type === 'batch-export:started') { setStatus(`开始导出，共 ${msg.total || 0} 个对象…`); return; }
        if (msg.type === 'batch-export-page') {
          setStatus(`正在导出 ${Number(msg.index || 0) + 1}/${msg.total || 0}：${msg.pageName || ''}`);
          let success = false;
          let error = '';
          try {
            success = await processComposition(msg.composition || null, Array.isArray(msg.imageIds) ? msg.imageIds : [], { includeFigmaRender: false, exportBaseDir: msg.targetDir, exportFolderName: msg.exportFolderName || msg.pageName });
            if (!success) error = '没有可导出的可见图层';
          } catch (reason) { error = reason && reason.message ? reason.message : String(reason); }
          parent.postMessage({ pluginMessage: { type: 'batch-export-page:ack', pageId: msg.pageId, success, error } }, '*');
          return;
        }
        if (msg.type === 'batch-export:page-skipped') { setStatus(`已跳过：${msg.pageName || '空对象'}`); return; }
        if (msg.type === 'batch-export:page-failed') { setStatus(`导出失败：${msg.pageName || '对象'} — ${msg.error || '未知错误'}`, 'error'); return; }
        if (msg.type === 'batch-export:finished') {
          const summary = msg.summary || {};
          setStatus(`导出完成：成功 ${summary.exported || 0}，跳过 ${summary.skipped || 0}，失败 ${summary.failed || 0}`, summary.failed ? 'error' : 'success');
          batchInProgress = false;
          updateSelection(selectedItems);
          return;
        }
        if (msg.type === 'export-missing-images:result' && typeof pendingExportResolve === 'function') {
          pendingExportResolve({ items: Array.isArray(msg.items) ? msg.items : [] });
          pendingExportResolve = null;
          return;
        }
        if (msg.type === 'export-figma-render:result' && typeof pendingPreviewResolve === 'function') {
          pendingPreviewResolve({ base64: typeof msg.base64 === 'string' ? msg.base64 : '' });
          pendingPreviewResolve = null;
        }
      };

      ping();
      setInterval(ping, 3000);
    </script>
  </body>
</html>
